name: MacOS-Wheels-Build

on:
  push:
    tags:
      - '**'

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: 311
            platform_id: macosx_x86_64
            env:
              MACOSX_DEPLOYMENT_TARGET: 14.0
          - os: macos-15
            python: 311
            platform_id: macosx_x86_64
            env:
              MACOSX_DEPLOYMENT_TARGET: 15.0
          - os: macos-26
            python: 311
            platform_id: macosx_x86_64
            env:
              MACOSX_DEPLOYMENT_TARGET: 26.0

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"

      # Used to host cibuildwheel
      - uses: actions/setup-python@v5
        with: 
          python-version: "3.11" # update once build dependencies are available

      - name: Build Wheels
        run: bash scripts/build_macos_wheels.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: fixed_wheelhouse/*.whl

  publish:
    needs: build_wheels
    name: Publish Python 🐍 distribution 📦 to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/g-mmpbsa
    permissions:
      id-token: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-*
          path: dist
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel twine

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  test_pypi_wheels:
    needs: publish
    name: Test PyPI wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
        include:
          - platform_id: macosx_x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "true"
          
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python }}

      - name: running tests
        run: bash scripts/test_macos_wheels.sh